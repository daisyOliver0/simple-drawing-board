<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Drawing Board</title>
<style>
body{font-family:Arial;background:#ecfeff;padding:20px;text-align:center}
main{max-width:750px;margin:auto;background:white;padding:25px;border-radius:16px}
canvas{width:100%;height:auto;background:white;border:2px solid #94a3b8;border-radius:8px;touch-action:none}
.controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px 0}
button{background:#0891b2;color:white;border:0;padding:12px 18px;border-radius:7px;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Simple Drawing Board</h1>
<p>Express your creativity with a digital canvas.</p>
<div class="controls">
<label>Color <input id="color" type="color" value="#0891b2"></label>
<label>Brush <input id="size" type="range" min="1" max="30" value="5"></label>
</div>
<canvas id="canvas" width="700" height="400"></canvas>
<div class="controls">
<button onclick="clearCanvas()">Clear Canvas</button>
<button onclick="saveImage()">Save Image</button>
</div>
</main>
<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let drawing=false;
function position(event){
 const rect=canvas.getBoundingClientRect();
 return {
 x:(event.clientX-rect.left)*canvas.width/rect.width,
 y:(event.clientY-rect.top)*canvas.height/rect.height
 };
}
canvas.addEventListener("pointerdown",event=>{
 drawing=true;
 canvas.setPointerCapture(event.pointerId);
 const p=position(event);
 ctx.beginPath();
 ctx.moveTo(p.x,p.y);
 ctx.lineTo(p.x+0.01,p.y);
 ctx.strokeStyle=document.getElementById("color").value;
 ctx.lineWidth=Number(document.getElementById("size").value);
 ctx.lineCap="round";
 ctx.lineJoin="round";
 ctx.stroke();
});
canvas.addEventListener("pointermove",event=>{
 if(!drawing)return;
 const p=position(event);
 ctx.lineTo(p.x,p.y);
 ctx.stroke();
 ctx.beginPath();
 ctx.moveTo(p.x,p.y);
});
canvas.addEventListener("pointerup",()=>drawing=false);
canvas.addEventListener("pointercancel",()=>drawing=false);
canvas.addEventListener("lostpointercapture",()=>drawing=false);
function clearCanvas(){
 ctx.fillStyle="white";
 ctx.fillRect(0,0,canvas.width,canvas.height);
}
function saveImage(){
 const link=document.createElement("a");
 link.download="my-drawing.png";
 link.href=canvas.toDataURL("image/png");
 link.click();
}
clearCanvas();
</script>
</body>
</html>
