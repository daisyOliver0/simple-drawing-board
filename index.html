<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simple Drawing Board</title>
<style>
body{font-family:Arial;background:#f8fafc;padding:20px;text-align:center}
main{max-width:850px;margin:auto;background:white;padding:20px;border-radius:15px}
canvas{width:100%;height:400px;border:2px solid #cbd5e1;border-radius:8px;touch-action:none}
.controls{margin:15px}
button{background:#2563eb;color:white;border:0;padding:11px 16px;border-radius:7px;cursor:pointer;margin:5px}
input{margin:8px}
</style>
</head>
<body>
<main>
<h1>Simple Drawing Board</h1>
<p>Draw, clear and export your artwork.</p>
<div class="controls">
<label>Color <input id="color" type="color" value="#2563eb"></label>
<label>Brush Size <input id="size" type="range" min="1" max="30" value="5"></label>
</div>
<canvas id="canvas" width="1200" height="600"></canvas>
<div class="controls">
<button onclick="clearCanvas()">Clear Canvas</button>
<button onclick="downloadImage()">Download PNG</button>
</div>
<p id="status"></p>
</main>
<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let drawing=false;
function position(e){
 const rect=canvas.getBoundingClientRect();
 return {
  x:(e.clientX-rect.left)*canvas.width/rect.width,
  y:(e.clientY-rect.top)*canvas.height/rect.height
 };
}
canvas.addEventListener("pointerdown",e=>{
 drawing=true;
 canvas.setPointerCapture(e.pointerId);
 const p=position(e);
 ctx.beginPath();
 ctx.moveTo(p.x,p.y);
});
canvas.addEventListener("pointermove",e=>{
 if(!drawing)return;
 const p=position(e);
 ctx.lineWidth=Number(document.getElementById("size").value);
 ctx.strokeStyle=document.getElementById("color").value;
 ctx.lineCap="round";
 ctx.lineJoin="round";
 ctx.lineTo(p.x,p.y);
 ctx.stroke();
});
function stopDrawing(){
 drawing=false;
 ctx.beginPath();
}
canvas.addEventListener("pointerup",stopDrawing);
canvas.addEventListener("pointercancel",stopDrawing);
function clearCanvas(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 document.getElementById("status").textContent="Canvas cleared.";
}
function downloadImage(){
 const temp=document.createElement("canvas");
 temp.width=canvas.width;
 temp.height=canvas.height;
 const t=temp.getContext("2d");
 t.fillStyle="#ffffff";
 t.fillRect(0,0,temp.width,temp.height);
 t.drawImage(canvas,0,0);
 const link=document.createElement("a");
 link.download="my-drawing.png";
 link.href=temp.toDataURL("image/png");
 link.click();
 document.getElementById("status").textContent="PNG export started.";
}
</script>
</body>
</html>
